<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/meal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 프로젝트명과 주요 키워드를 함께 노출 -->
    <title>MealPicker | 점메추 · 저메추 · 돌림판</title>

    <!-- 검색 결과에 표시될 간단한 설명 (한글 키워드 포함) -->
    <meta
      name="description"
      content="점메추·저메추·룰렛 돌림판 MealPicker – 오늘의 메뉴를 돌려서 결정해 보세요!"
    />

    <!-- 네이버·다음 등의 포털 색인에 도움을 주는 키워드 목록 -->

    <!-- 검색 엔진(크롤러)이 이 페이지를 인덱스하도록 허용 -->
    <meta name="robots" content="index,follow" />

    <!-- SNS 공유 시 썸네일·제목·설명용 -->
    <meta property="og:title" content="MealPicker | 점메추·저메추·돌림판" />
    <meta
      property="og:description"
      content="점메추·저메추·룰렛 돌림판 MealPicker – 오늘의 메뉴를 돌려서 결정해 보세요!"
    />

    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:type" content="website" />

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
